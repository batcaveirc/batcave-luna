name: Luna Relay Bot

on:
  push:
    branches: [ main ]
  schedule:
    # Every 5 minutes: if the previous run has ended, start a fresh one.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

# One Luna at a time. cancel-in-progress:false means the 5-minute cron does NOT
# kill a running bot — the new run waits and takes over when the current one
# hits its timeout below. Continuous coverage with a handoff every ~5.8h.
#
# NOTE: the concurrency group is Luna's own, so this never queues behind or
# cancels the Dracula workflow in the other repo.
concurrency:
  group: luna-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # just under GitHub's 6-hour hard cap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Run Luna
        env:
          # ── Secrets ──────────────────────────────────────────────────────
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          OWNER_IDS: ${{ secrets.OWNER_IDS }}
          IRC_NICKSERV_PASS: ${{ secrets.IRC_NICKSERV_PASS }}
          # Hosted AI for !!ai. Placeholder until the key is added — without
          # it the command says so plainly instead of erroring.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
          GROQ_MODEL_FALLBACK: ${{ secrets.GROQ_MODEL_FALLBACK || 'openai/gpt-oss-20b' }}

          # ── IRC: plain defaults so a missing secret can never stop the bot.
          #    IRC_CHANNEL defaults to the emoji room Luna lives in. ────────
          IRC_SERVER: ${{ secrets.IRC_SERVER || 'irc.hybridirc.com' }}
          IRC_PORT: ${{ secrets.IRC_PORT || '6697' }}
          IRC_NICK: ${{ secrets.IRC_NICK || 'Luna1' }}
          IRC_REALNAME: ${{ secrets.IRC_REALNAME || 'Keeping the night company' }}
          # The relayed room. Only this one crosses to Discord.
          IRC_CHANNEL: ${{ secrets.IRC_CHANNEL || '#🅱🅰🆃🅲🅰🆅🅴' }}
          # Joined and moderated, but NOT relayed. Use $ircjoin in Discord to
          # start relaying one of these — presence and publication are separate
          # decisions and the second should always be deliberate.
          IRC_EXTRA_CHANNELS: ${{ secrets.IRC_EXTRA_CHANNELS || '#batcave' }}

          # Auto-moderation covering the gaps Dracula cannot see. Off unless
          # turned on with $mod on, or this secret set to "on".
          LUNA_MOD: ${{ secrets.LUNA_MOD || 'off' }}
          LUNA_SEVERE_WORDS: ${{ secrets.LUNA_SEVERE_WORDS }}
          LUNA_WHITELIST_IRC: ${{ secrets.LUNA_WHITELIST_IRC || secrets.WHITELIST }}
          # Host masks Luna never acts on, for regulars who change nick.
          TRUSTED_MASKS: ${{ secrets.TRUSTED_MASKS }}

          # ── Discord side of the bridge ───────────────────────────────────
          BRIDGE_CHANNEL: ${{ secrets.BRIDGE_CHANNEL || '🅱🅰🆃🅲🅰🆅🅴' }}
          NSFW_CHANNEL: ${{ secrets.NSFW_CHANNEL || 'nsfw' }}
          ALERT_CHANNEL: ${{ secrets.ALERT_CHANNEL || 'bot-logs' }}
          MOD_ROLE: ${{ secrets.MOD_ROLE }}
          LUNA_PREFIX: ${{ secrets.LUNA_PREFIX || '$' }}

          # ── Identity kept out of a public repo ───────────────────────────
          LUNA_CREDIT: ${{ secrets.LUNA_CREDIT }}
          LUNA_OWNERS_IRC: ${{ secrets.LUNA_OWNERS_IRC }}
          LUNA_PRIMARY_OWNER: ${{ secrets.LUNA_PRIMARY_OWNER }}

          # ── Optional StarAlign relay: dormant unless both are set ────────
          STARALIGN_RELAY_URL: ${{ secrets.STARALIGN_RELAY_URL }}
          STARALIGN_RELAY_SECRET: ${{ secrets.STARALIGN_RELAY_SECRET }}

        run: python luna.py
